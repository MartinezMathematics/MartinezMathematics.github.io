name: Auto-Catalog New Manuscripts

on:
  push:
    paths:
      - '*.pdf'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --upgrade google-genai pypdf

      - name: Run Manuscript Cataloger
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python catalog_papers.py

      - name: Commit Updated Catalog
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add manuscripts.json
          if git diff --staged --quiet; then
            echo "No changes in manuscripts.json to commit."
          else
            git commit -m "Auto-catalog newly detected mathematical manuscripts [skip ci]"
            git push
          fi
